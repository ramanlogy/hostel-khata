<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Hostel Khata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: white sidebar, pastel status cards that double as filters, one calm white list. Red late, yellow soon, green paid, everywhere. */
:root{
  color-scheme:light;
  --bg:#eef3f1;--panel:#ffffff;--ink:#1b2b28;--muted:#5f6f6a;--rule:#e1e8e5;--tint:#f1f5f3;
  --f-late:#e5534b;--f-soon:#f0b429;--f-ok:#2fb56a;--f-stay:#6a5ee8;--lime:#d4f266;--on-lime:#1b2b28;--wa:#0e7a6c;--on-wa:#ffffff;
  --c-all:#d9d5fb;--c-late:#ffd6d2;--c-soon:#ffe9a6;--c-ok:#bfedcd;
  --late:#a8231b;--soon:#765000;--ok:#17653a;
  --display:"Poppins","Mukta",system-ui,sans-serif;--body:"Mukta",system-ui,"Noto Sans Devanagari",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
svg{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:1400px;margin-inline:auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
.side{background:var(--panel);border-radius:20px;padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:16px;min-height:calc(100vh - 56px)}
.brand{font:600 22px/1 var(--display);padding-inline:10px}
nav{display:grid;gap:8px}
.nav{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:0;border-radius:14px;background:none;font-weight:500;font-size:18px;text-align:left}
.nav[aria-current="page"]{background:var(--lime);color:var(--on-lime);font-weight:600}
.badge{margin-left:auto;background:var(--late);color:var(--panel);border-radius:99px;min-width:28px;padding:0 8px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.lang{margin-top:auto;display:flex;background:var(--tint);border-radius:12px;padding:4px}
.lang button{flex:1;border:0;background:none;padding:6px 4px;min-height:42px;border-radius:9px}
.lang button[aria-pressed="true"]{background:var(--panel);font-weight:600}
.main{display:grid;gap:18px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.top h1{font:600 30px/1.2 var(--display);margin:0}
.today{color:var(--muted)}
.note{font-size:15px;color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:grid;gap:2px;text-align:left;border:3px solid transparent;border-radius:18px;padding:16px 18px;color:var(--ink)}
.stat[aria-pressed="true"]{border-color:var(--ink)}
.stat .lab{font-weight:600;font-size:18px}
.stat .n{font:600 40px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font-size:16px}
.c-all{background:var(--c-all)}.c-late{background:var(--c-late)}.c-soon{background:var(--c-soon)}.c-ok{background:var(--c-ok)}
.search{width:100%;min-height:54px;padding:0 18px;border:0;border-radius:14px;background:var(--panel)}
.book{background:var(--panel);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(210px,2.2fr) .95fr 1.1fr 1.05fr 1.2fr 236px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row.head{font-size:16px;font-weight:500;color:var(--muted);padding-block:12px 8px}
.who{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.face{width:48px;height:48px;border-radius:50%;background:var(--c-all);display:grid;place-items:center;font:600 17px var(--display);flex:none}
.face.late{background:var(--c-late);color:var(--late)}.face.soon,.face.today{background:var(--c-soon);color:var(--soon)}.face.paid{background:var(--c-ok);color:var(--ok)}
.name{display:block;font-weight:600;font-size:19px;line-height:1.25}
.sub{display:block;color:var(--muted);font-size:15.5px;line-height:1.3}
.sub.warn{color:var(--soon);font-weight:600}
.cell{min-width:0;font-variant-numeric:tabular-nums}
.cell[data-l]::before{display:none}
.left{font-weight:700;font-size:20px}
.left.is-late{color:var(--late)}
.tag{display:inline-block;padding:1px 11px;border-radius:99px;font-size:15.5px;font-weight:600}
.tag.late{background:var(--c-late);color:var(--late)}.tag.soon{background:var(--c-soon);color:var(--soon)}.tag.ok{background:var(--c-ok);color:var(--ok)}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 14px;border-radius:13px;border:0;font-weight:600}
.pri{background:var(--lime);color:var(--on-lime);flex:1}
.wa{background:var(--wa);color:var(--on-wa)}
.sec{background:var(--tint)}
.wa[disabled]{visibility:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.big{font-size:20px;min-height:60px;padding:0 24px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.card{background:var(--panel);border-radius:18px;padding:20px;display:grid;gap:12px;min-width:0}
.headline{font:500 21px/1.3 var(--display);margin:0}
h2{font:600 21px/1.25 var(--display);margin:0}
.q{display:flex;align-items:center;gap:12px;padding:10px;border:0;border-radius:13px;background:none;text-align:left;width:100%}
.q[aria-current="true"]{background:var(--tint)}
.q.done{opacity:.6}
.q .end{margin-left:auto;text-align:right;flex:none}
.bubble{background:var(--c-ok);padding:16px 18px;border-radius:16px 16px 4px 16px;font-size:20px;line-height:1.45}
.ask{font:600 22px/1.25 var(--display)}
.row2{display:flex;flex-wrap:wrap;gap:10px}
.row2 .btn{flex:1 1 180px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fact b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:15.5px}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero .face{width:68px;height:68px;font-size:24px}
.hero h2{font-size:28px}
.hero .acts{margin-left:auto;flex-wrap:wrap}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tri .stat{cursor:default}
.tri .n{font-size:26px;line-height:1.3}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.line:first-of-type{border-top:0}
.line span:last-child{text-align:right;color:var(--muted);flex:none}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
label.fld{display:grid;gap:4px;font-weight:600}
.fld input,.fld select,.amt{min-height:54px;padding:0 14px;border:2px solid var(--rule);border-radius:12px;background:var(--tint);width:100%;font-weight:400}
.date3{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:6px}
.err{color:var(--late);font-size:16px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:0 18px;border:0;border-radius:12px;background:var(--tint);font-weight:500}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);font-weight:600}
dialog{border:0;border-radius:20px;padding:24px;background:var(--panel);color:var(--ink);width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(12,24,20,.55)}
.dlg{display:grid;gap:14px}
.amt{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.after{font-size:19px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);z-index:20}
#toast[hidden]{display:none}
#toast button{background:var(--bg);color:var(--ink);border:0;border-radius:9px;min-height:44px;padding:0 16px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.calhead h2{font-size:24px}
.calhead .sub{flex:1 1 auto}
.calnav{display:flex;gap:6px}
.calnav .btn{min-height:46px}
.calnav .btn[disabled]{opacity:.35;cursor:default}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk div{text-align:center;color:var(--muted);font-size:15.5px;font-weight:500}
.day{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:104px;padding:6px;border:2px solid transparent;border-radius:12px;background:var(--tint);text-align:left;overflow:hidden}
.day[aria-pressed="true"]{border-color:var(--ink)}
.day .top2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.day .d{font-weight:600;font-size:18px;line-height:28px;min-width:28px;text-align:center;border-radius:99px;font-variant-numeric:tabular-nums}
.day.now .d{background:var(--lime);color:var(--on-lime)}
.day .ad{font-size:13px;color:var(--muted)}
.ev{display:block;font-size:15px;line-height:1.35;padding:0 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:14.5px;color:var(--muted);padding-inline:6px}
.dl{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--rule)}
.dl:first-of-type{border-top:0;padding-top:0}
.dl .tagrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.floor{font:500 18px/1.2 var(--display);color:var(--muted);margin:4px 0 -6px}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.room{background:var(--panel);border-radius:18px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.room .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.room h3{font:600 19px/1.2 var(--display);margin:0}
.bed{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:62px;padding:8px 12px;border:0;border-radius:12px;text-align:left;color:var(--ink)}
.bed .sub{color:var(--ink)}
.bed b{display:block;font-weight:600;font-size:17.5px;line-height:1.25}
.bed .go{flex:none;background:var(--lime);color:var(--on-lime);border-radius:9px;padding:3px 12px;font-weight:600}
@media (max-width:1100px){.calwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .wk,.days{gap:3px}
  .day{min-height:66px;padding:4px}
  .day .ad{display:none}
  .ev{font-size:0;height:7px;padding:0}
}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .search{flex:1 1 260px;width:auto;min-width:0}
.bar .btn{min-height:54px;padding:0 20px}
.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sortrow .chip{background:var(--panel)}
.sortrow .chip[aria-pressed="true"]{background:var(--lime)}
.row.p{grid-template-columns:minmax(200px,2fr) 1fr 1.1fr 1fr 1fr 256px}
.del{background:var(--c-late);color:var(--late)}
.acts .sec{flex:1}
.owe{background:var(--c-late);color:var(--late);padding:8px 12px;border-radius:10px;font-weight:600}
.dlg p{margin:0}
.lefton{color:var(--muted)}
.meter{display:block;height:8px;max-width:150px;margin-top:5px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--ink) 13%,transparent)}
.meter i{display:block;height:100%;border-radius:inherit}
.meter.late i{background:var(--f-late)}.meter.soon i{background:var(--f-soon)}.meter.ok i{background:var(--f-ok)}.meter.stay i{background:var(--f-stay)}
.stat .meter,.bed .meter{max-width:none}
.stat .meter.late i,.bed .meter.late i{background:var(--late)}.stat .meter.soon i,.bed .meter.soon i{background:var(--soon)}.stat .meter.ok i,.bed .meter.ok i{background:var(--ok)}
.row.p{grid-template-columns:minmax(200px,2fr) 1fr 1.1fr 1fr 1fr 170px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.setgrid .wide{grid-column:1/-1}
.hint{color:var(--muted);font-size:15.5px;margin:0}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:4px 0;border:0;background:none;text-align:left}
.tgl .sw{flex:none;width:54px;height:30px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--panel)}
.tgl[aria-pressed="true"] .sw{background:var(--wa)}
.tgl[aria-pressed="true"] .sw::after{left:27px}
.fld textarea{width:100%;min-height:82px;padding:10px 14px;border:2px solid var(--rule);border-radius:12px;background:var(--tint);font-weight:400;resize:vertical}
.fld input,.fld select{color:var(--ink)}
.addline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.addline .fld{flex:1 1 150px;min-width:0}
.addline .btn{min-height:54px}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}
.rm b{min-width:76px;font-weight:600}
.bchip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--ink)}
.bchip button{border:0;background:none;font-size:20px;line-height:1;padding:0 2px;min-width:28px;min-height:36px}
.mini{border:0;border-radius:9px;background:var(--tint);min-height:38px;padding:0 12px;margin-left:8px;font-weight:600;font-size:15.5px}
.settle{display:grid;gap:4px;background:var(--tint);border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums}
.settle div{display:flex;justify-content:space-between;gap:12px}
.settle .res{font-weight:700;font-size:19px;padding-top:6px;border-top:1px solid var(--rule)}
.rc{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.rc div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--rule)}
.rc .big2{font-size:24px;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .chip{min-height:42px;padding:0 12px}
.todo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.todo p{margin:0;flex:1 1 280px;font:500 20px/1.3 var(--display);text-wrap:balance}
.todo .btn{min-height:52px;padding:0 18px}
.stat .n.money{font-size:30px;line-height:1.3}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch .sub{margin-top:1px}
.seeall{flex:none;border:0;border-radius:10px;background:var(--lime);color:var(--on-lime);min-height:42px;padding:0 14px;font-weight:600}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 150px 232px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.drow:first-of-type{border-top:0}
.drow .cell{font-size:16px;line-height:1.35}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.prow:first-of-type{border-top:0}
.prow .face{width:42px;height:42px;font-size:15px}
.prow .who{flex:1}
.prow .name{font-size:17.5px}
.prow b{flex:none;font-weight:700}
.plot{position:relative;height:150px;margin:14px 0 0 88px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.gl span{position:absolute;right:100%;margin-right:8px;top:-11px;font-size:14.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end}
.bcol{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;outline-offset:-2px}
.bcol i{display:block;width:min(36px,60%);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--f-stay) 55%,var(--panel))}
.bcol.cur i{background:var(--f-stay)}
.bcol .val{position:absolute;left:50%;transform:translateX(-50%);font-size:14.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bcol:hover i,.bcol:focus-visible i{background:var(--f-stay)}
.bcol[data-tip]:hover::after,.bcol[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% - 20px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:7px;font-size:14.5px;white-space:nowrap;z-index:3}
.xl{display:flex;margin-left:88px;margin-top:4px}
.xl span{flex:1;text-align:center;font-size:14.5px;color:var(--muted);min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.row.pay{grid-template-columns:minmax(200px,2fr) 1fr 1fr 1.2fr 120px}
.row.pay .mini{margin-left:0}
.setlist{display:grid;gap:10px;max-width:920px}
.setsec{background:var(--panel);border-radius:18px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 18px;border:0;background:none;text-align:left}
.secico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--ink)}
.sechead .t{flex:1;min-width:0}
.sechead b{display:block;font:600 19px/1.25 var(--display)}
.sechead .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sechead .chev{flex:none;color:var(--muted);transition:none}
.setsec.open .chev{transform:rotate(180deg)}
.secbody{padding:0 18px 16px;display:grid}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:8px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.setrow .sq{font-weight:600;font-size:18px;line-height:1.3}
.setrow .sub{font-weight:400}
.setrow select,.setrow input{width:100%;min-height:56px;padding:0 14px;border:2px solid var(--rule);border-radius:12px;background:var(--tint);font-size:18px;color:var(--ink)}
.setrow select{cursor:pointer}
.tgl{border-top:1px solid var(--rule);min-height:60px;font-size:18px;font-weight:500}
.tgl .rgt{display:flex;align-items:center;gap:10px;flex:none}
.tgl .word{color:var(--muted);font-size:16px;font-weight:600;min-width:28px;text-align:right}
.tgl[aria-pressed="true"] .word{color:var(--ok)}
.editor{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.editor textarea{width:100%;min-height:96px;padding:12px 14px;border:2px solid var(--rule);border-radius:12px;background:var(--tint);font-size:18px;resize:vertical;color:var(--ink)}
.editor .sq{font-weight:600;font-size:18px}
.editor .quick{align-items:center}
.bedbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.bedbox .bchip{min-height:50px;font-size:17.5px}
@media (max-width:680px){.setrow{grid-template-columns:minmax(0,1fr)}}
a.btn{text-decoration:none}
@media (max-width:1240px){.row.pay{grid-template-columns:1fr 1fr}}
@media (max-width:1100px){.home{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.drow{grid-template-columns:minmax(0,1fr)}.plot,.xl{margin-left:70px}.gl span{font-size:13px}}
@media (max-width:1240px){.row.p{grid-template-columns:1fr 1fr}}

let nextId=1;
function dues(j,jd){const a=[j];let p=j;for(;;){const n=addMonth(p,jd);if(n>TODAY||n===p)break;a.push(n);p=n}return a}
function make(name,ph,gd,room,fee,y,m,d,months,state){
  const join=toIdx(y,m,d),ds=dues(join,d),last=ds[ds.length-1];
  const unpaid=state==='late2'?2:(state==='late1'||state==='today')?1:0;
  const paidDs=ds.slice(0,ds.length-unpaid);
  const pays=[];
  if(state==='part')pays.push({d:TODAY,a:4000,h:'esewa'});
  paidDs.slice().reverse().forEach((due,i)=>{if(state==='part'&&i===0)return;pays.push({d:Math.min(due+(name.length%3),TODAY),a:fee,h:['cash','esewa','bank'][name.length%3]})});
  const left=state==='late2'?fee*2:state==='late1'||state==='today'?fee:state==='part'?fee-4000:0;
  const lateSince=left?(state==='late2'?ds[ds.length-2]:last):null;
  const log=[{d:join,k:'lJoin'}];
  pays.slice().reverse().forEach(p=>log.push({d:p.d,k:'lPaid',a:p.a,h:p.h}));
  return{id:nextId++,name,ph,gd,room,fee,join,jd:d,months,left,lateSince,nextDue:addMonth(last,d),pays,log,credit:0,sent:false};
}

function status(s){
  if(s.left>0)return s.lateSince<TODAY?'late':'today';
  return s.nextDue-TODAY<=cfg.soonDays?'soon':'paid';
}
const ORDER={late:0,today:1,soon:2,paid:3};
const elapsed=s=>{let n=0,p=s.join;for(;;){const x=addMonth(p,s.jd);if(x>TODAY||x===p)break;n++;p=x}return n};
const mLeft=s=>s.months-elapsed(s);
const endIdx=s=>{let p=s.join;for(let i=0;i<s.months;i++)p=addMonth(p,s.jd);return p};
const meter=(pct,cls,label)=>`<span class="meter ${cls}" role="img" aria-label="${esc(label)}"><i style="width:${Math.round(Math.max(0,Math.min(100,pct)))}%"></i></span>`;
function dueMeter(s){
  const st=status(s);
  if(st==='late')return meter(100,'late',t('late'));
  if(st==='today')return meter(100,'soon',t('dueToday'));
  const days=s.nextDue-TODAY;
  return meter(Math.max(5,(30-days)/30*100),st==='soon'?'soon':'ok',t('daysLeft',days));
}
const stayDays=s=>endIdx(s)-TODAY;
const isEnding=s=>stayDays(s)<=cfg.endSoon;
const stayText=s=>(isEnding(s)?t('daysLeft',Math.max(stayDays(s),0)):t('monthsLeft',mLeft(s))).replace(/\d+/g,num);
function stayMeter(s){
  const total=Math.max(endIdx(s)-s.join,1);
  return meter(Math.max(5,(TODAY-s.join)/total*100),isEnding(s)?'soon':'stay',stayText(s));
}
function dueCell(s){
  const st=status(s);
  if(st==='late'){const n=TODAY-s.lateSince;return`${fmtS(s.lateSince)}<br><span class="tag late">${t('daysLate',n).replace(/\d+/g,num)}</span>${dueMeter(s)}`}
  if(st==='today')return`${fmtS(TODAY)}<br><span class="tag soon">${t('dueToday')}</span>${dueMeter(s)}`;
  if(st==='soon')return`${fmtS(s.nextDue)}<br><span class="tag soon">${t('inDays',s.nextDue-TODAY).replace(/\d+/g,num)}</span>${dueMeter(s)}`;
  return`${fmtS(s.nextDue)}<br><span class="tag ok">${t('paidDays',s.nextDue-TODAY).replace(/\d+/g,num)}</span>${dueMeter(s)}`;
}

   item('list',I.grid,t('dashboard'))+

   item('settings',I.gear,t('settings'));
}

    if(filter==='soon'&&!(st==='soon'||st==='today'))return false;
    if(filter==='paid'&&st!=='paid')return false;
    return !f||s.name.toLowerCase().includes(f)||s.room.toLowerCase().includes(f)}).sort((a,b)=>ORDER[status(a)]-ORDER[status(b)]);
  const body=list.map(s=>{
    const st=status(s),lp=s.pays[0],ml=mLeft(s);
    const leftTxt=s.left?`<span class="left ${st==='late'?'is-late':''}">${rs(s.left)}</span>${s.left<s.fee?`<span class="sub">${t('partPaid')}</span>${meter((s.fee-s.left)/s.fee*100,'ok',t('partPaid'))}`:''}`:s.credit?`<span class="sub">${t('adv')} ${rs(s.credit)}</span>`:`<span class="sub">${t('none')}</span>`;
    return`<div class="row">
    <button type="button" class="who" data-act="open" data-id="${s.id}"><span class="face ${st}">${esc(initials(s.name))}</span><span style="min-width:0"><span class="name">${esc(s.name)}</span><span class="sub ${isEnding(s)?'warn':''}">${t('room')} ${num(esc(s.room))} · ${stayText(s)}</span></span></button>
    <div class="cell" data-l="${t('cFee')}">${rs(s.fee)}</div>
    <div class="cell" data-l="${t('cLast')}">${lp?`${fmtS(lp.d)}<span class="sub">${rs(lp.a)}</span>`:`<span class="sub">${t('notYet')}</span>`}</div>
    <div class="cell" data-l="${t('cLeft')}">${leftTxt}</div>

let toastTimer;
function toast(msg,undo){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button" id="undo">${t('undo')}</button>`:''}`;
  el.hidden=false;clearTimeout(toastTimer);
  if(undo)document.getElementById('undo').onclick=()=>{undo();el.hidden=true;toast(t('undone'))};
  toastTimer=setTimeout(()=>el.hidden=true,undo?9000:3000);
}

T.en.esewa='eSewa';T.en.khalti='Khalti';T.ne.esewa='eSewa';T.ne.khalti='Khalti';
function applyPay(s,amt,how){
  const snap=JSON.stringify(s),arr=S.includes(s)?S:PAST,i=arr.indexOf(s);
  let extra=amt-s.left;
  if(extra>=0){s.left=0;s.lateSince=null;s.credit+=extra;
    while(s.credit>=s.fee){s.nextDue=addMonth(s.nextDue,jdOf(s));s.credit-=s.fee}
  }else s.left-=amt;
  s.pays.unshift({d:TODAY,a:amt,h:how});
  s.log.push({d:TODAY,k:'lPaid',a:amt,h:how});
  s.sent=false;
  render();
  toast(t('saved',rs(amt),s.name),()=>{arr[i]=JSON.parse(snap);render()});
}
document.addEventListener('input',e=>{
  if(e.target.id==='search'){q=e.target.value;renderRows()}
  if(e.target.id==='psearch'){pq=e.target.value;renderPeopleRows()}
  if(e.target.id==='s-name')cfg.name=e.target.value;
  if(e.target.id==='s-fee')cfg.defaultFee=Number(e.target.value.replace(/\D/g,''))||0;
  if(e.target.dataset.tpl){cfg.tpl[lang][e.target.dataset.tpl]=fromFriendly(e.target.value);document.getElementById('s-preview').textContent=previewText()}
  if(e.target.id==='p-amt'){payState.amt=e.target.value;updAfter()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='s-name'||e.target.id==='s-fee'){render();toast(t('savedS'));return}
  if(e.target.dataset.tpl){toast(t('savedS'));return}
  const k=e.target.dataset.set;if(!k)return;const v=e.target.value;
  if(k==='billing'){cfg.billing=v;applyBilling()}
  if(k==='billDay'){cfg.billDay=+v;applyBilling()}
  if(k==='soonDays')cfg.soonDays=+v;
  if(k==='endSoon')cfg.endSoon=+v;
  if(k==='lang')lang=v;
  if(k==='msgKey')msgKey=v;
  if(k==='room')setRoom=v;
  render();
  document.querySelector(`[data-set="${k}"]`)?.focus();
  if(k!=='msgKey'&&k!=='room')toast(t('savedS'));
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='payf'){
    const a=amtVal();
    if(a<=0){document.getElementById('p-err').textContent=t('amtErr');return}
    const s=byId(payState.id);dlg.close();applyPay(s,a,payState.how);
  }
  if(e.target.id==='addf'){
    const g=id=>document.getElementById(id)?.value.trim()??'',err=document.getElementById('a-err');
    const name=g('a-name'),ph=g('a-ph'),gd=g('a-gd'),fee=Number(g('a-fee').replace(/[^\d]/g,''));
    if(!name){err.textContent=t('nameErr');return}
    if(!/^\d{10}$/.test(ph)){err.textContent=t('phoneErr');return}
    if(!fee){err.textContent=t('feeErr');return}
    if(!g('a-room')){err.textContent=t('roomErr');return}
    const y=+g('a-y'),m=+g('a-m'),d=+g('a-d'),join=toIdx(y,m,Math.min(d,ML[y][m-1]));
    const ds=dues(join,d),last=ds[ds.length-1];
    const extra={};if(cfg.fields.college)extra[t('fCollege')]=g('a-college');if(cfg.fields.address)extra[t('fAddress')]=g('a-address');cfg.custom.forEach((c,i)=>extra[c]=g('a-c'+i));
    S.push({id:nextId++,name,ph,gd:gd||ph,room:g('a-room'),fee,join,jd:d,months:stay,left:fee,lateSince:last,nextDue:addMonth(last,cfg.billing==='fixed'?cfg.billDay:d),pays:[],log:[{d:join,k:'lJoin'}],credit:0,sent:false,dep:Number(g('a-dep').replace(/\D/g,''))||0,extra});
    bookBed=null;view='people';peopleSort='join';pq='';render();toast(t('addedS',name));
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const{act,v}=b.dataset,s=b.dataset.id?byId(+b.dataset.id):null;
  if(act==='lang'){lang=v;if(dlg.open)dlg.close();render()}
  if(act==='go'){view=v;bookBed=null;render();window.scrollTo(0,0)}
  if(act==='filter'){filter=filter===v?'topay':v;render()}
  if(act==='open'){if(view!=='one')backTo=view;cur=s.id;view='one';render();window.scrollTo(0,0)}
  if(act==='pay')openPay(s);
  if(act==='wa'){wa={id:s.id,step:'ready'};s.sent=false;view='msgs';render();window.scrollTo(0,0)}
  if(act==='pick'){wa={id:s.id,step:'ready'};render()}
  if(act==='waopen'){setTimeout(()=>{wa.step='confirm';render()},150)}
  if(act==='wano'){wa.step='ready';render()}
  if(act==='wayes'){const x=S.find(y=>y.id===wa.id);x.sent=true;x.log.push({d:TODAY,k:'lMsg'});wa.step='ready';toast(t('sentOk',x.name));render()}
  if(act==='stay'){stay=+v;document.querySelectorAll('[data-act="stay"]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.v===stay))}
  if(act==='amt'){payState.amt=v;document.getElementById('p-amt').value=v;updAfter()}
  if(act==='how'){payState.how=v;document.querySelectorAll('[data-act="how"]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v))}
  if(act==='paycancel')dlg.close();
  if(act==='mod'){cfg.mods[v]=!cfg.mods[v];render()}
  if(act==='pmt'){const on=Object.values(cfg.pay).filter(Boolean).length;if(!cfg.pay[v]||on>1){cfg.pay[v]=!cfg.pay[v];render()}else toast(t('payKeep'))}
  if(act==='fld'){cfg.fields[v]=!cfg.fields[v];render()}
  if(act==='bill'){cfg.billing=v;applyBilling();render()}
  if(act==='soond'){cfg.soonDays=+v;render()}
  if(act==='endd'){cfg.endSoon=+v;render()}
  if(act==='cfadd'){const el=document.getElementById('s-own'),x=el.value.trim();if(x&&!cfg.custom.includes(x)){cfg.custom.push(x);render()}}
  if(act==='cfdel'){cfg.custom.splice(+v,1);render()}
  if(act==='bedadd'){const has=BEDS.filter(b=>b.startsWith(v+'-')).map(b=>b.split('-')[1]);const L='ABCDEFGHIJKL'.split('').find(c=>!has.includes(c));if(L){BEDS.push(v+'-'+L);BEDS.sort();render()}}
  if(act==='beddel'){if(!S.some(x=>x.room===v)){BEDS=BEDS.filter(b=>b!==v);render()}}
  if(act==='roomadd'){const r=document.getElementById('s-room').value.trim(),n=+document.getElementById('s-beds').value,err=document.getElementById('s-err');
    if(!/^[0-9]+$/.test(r)){err.textContent=t('roomBad');return}
    if(BEDS.some(b=>b.startsWith(r+'-'))){err.textContent=t('roomDup');return}
    for(let i=0;i<n;i++)BEDS.push(r+'-'+'ABCDEF'[i]);BEDS.sort();setRoom=r;render();toast(t('savedS'))}
  if(act==='setopen'){setOpen=setOpen===v?null:v;render()}
  if(act==='tok'){const a=document.getElementById('s-tpl'),ins=`[${tokLabel(v)}]`,st=a.selectionStart??a.value.length,en=a.selectionEnd??st;a.value=a.value.slice(0,st)+ins+a.value.slice(en);a.dispatchEvent(new Event('input',{bubbles:true}));a.focus();a.selectionStart=a.selectionEnd=st+ins.length}
  if(act==='tplreset'){cfg.tpl[lang][msgKey]=DEF_TPL[lang][msgKey];render();toast(t('savedS'))}
  if(act==='receipt')openReceipt(s,+v);
  if(act==='rcsend'){setTimeout(()=>{askDlg.close();toast(t('rcOpened'))},150)}
  if(act==='expq')document.getElementById('e-what').value=v;
  if(act==='expadd'){const w=document.getElementById('e-what').value.trim(),a=Number(document.getElementById('e-amt').value.replace(/\D/g,''));if(!w||!a){document.getElementById('e-err').textContent=t('expErr');return}EXP.push({d:TODAY,what:w,a});render()}
  if(act==='psort'){peopleSort=v;render()}
  if(act==='prange'){payRange=v;render()}
  if(act==='finish'||act==='delete')openAsk(act,s);
  if(act==='askno')askDlg.close();
  if(act==='askyes'){const{type,id}=askState,x=byId(id);askDlg.close();type==='finish'?doFinish(x):doDelete(x)}
  if(act==='calmove'){let m=calM+ +v,y=calY;if(m<1){m=12;y--}if(m>12){m=1;y++}if(ML[y]){calY=y;calM=m;calSel=toIdx(y,m,1);render()}}
  if(act==='caltoday'){[calY,calM]=fromIdx(TODAY);calSel=TODAY;render()}
  if(act==='day'){calSel=+v;render()}
  if(act==='roomf'){roomF=roomF===v?'all':v;render()}
  if(act==='book'){bookBed=v;view='add';render();window.scrollTo(0,0)}
});
render();
